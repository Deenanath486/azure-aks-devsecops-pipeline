name: "DevSecOps Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  # ==========================================
  # STAGE 1: Secret Scanning
  # ==========================================
  secret-scan:
    name: "Gate 1: Secret Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # STAGE 2: Code Quality & Static Analysis
  # ==========================================
  code-analysis:
    name: "Gate 2: SAST & Linting"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit

      - name: Run Flake8 Linter
        run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Bandit Security Analysis
        run: bandit -r app/ -ll

  # ==========================================
  # STAGE 3: Infrastructure as Code (IaC) Scan
  # ==========================================
  iac-security-scan:
    name: "Gate 3: IaC Scan (Trivy & Terraform Validate)"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format Check
        run: terraform -chdir=infra fmt -check

      - name: Terraform Validate
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

      - name: Run Trivy IaC Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'infra/'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  # ==========================================
  # STAGE 4: Container Build & Image CVE Scan
  # ==========================================
  container-security-scan:
    name: "Gate 4: Container CVE Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: [code-analysis, iac-security-scan]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: microservice:scan-${{ github.sha }}

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'microservice:scan-${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

  # ==========================================
  # STAGE 5: Helm Chart Validation & Package
  # ==========================================
  helm-validation:
    name: "Gate 5: Helm Lint & Validation"
    runs-on: ubuntu-latest
    needs: container-security-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: helm lint charts/microservice

      - name: Helm Dry-Run Template
        run: helm template test-release charts/microservice
